<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PRIME</title>
<style>
:root{--bg:#fff;--fg:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:#fff;color:#111;overflow:hidden;overscroll-behavior:none;
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s}
.screen.on{opacity:1;pointer-events:auto}
h1{font-weight:200;font-size:clamp(40px,9vw,84px);letter-spacing:.18em;margin:0 0 0 .18em}
.sub{font-size:10px;letter-spacing:.3em;opacity:.5;margin:18px 0 64px .3em}
.link{font-size:12px;letter-spacing:.3em;cursor:pointer;opacity:1;transition:opacity .2s;margin-left:.3em;padding:12px 16px}
.link:hover{opacity:.45}
#game{touch-action:none;cursor:grab;transition:opacity .25s}
.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);font-size:11px;letter-spacing:.22em;opacity:.55;pointer-events:none}
#sc{left:22px}#tm{right:76px}#quit{right:14px;cursor:pointer;pointer-events:auto;padding:12px 8px;margin:-12px -8px;top:calc(env(safe-area-inset-top,0px) + 18px);transition:opacity .2s}#quit:hover{opacity:.3}
#conf{z-index:5;background:#fff;transition:opacity .2s}
#board{justify-content:flex-start;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 56px) 24px 56px;touch-action:pan-y}
.bd{width:100%;max-width:420px}.bd .lab{margin:36px 0 14px}.bd .lab:first-child{margin-top:0}
.r{display:flex;gap:14px;align-items:baseline;font-size:13px;padding:6px 0;font-weight:300}.r em{font-style:normal;opacity:.4;width:28px;font-size:10px;letter-spacing:.1em}.r b{font-weight:300;font-size:18px;flex:1;text-align:right}.r span{opacity:.5;font-size:10px;letter-spacing:.06em}
#nm{width:min(560px,80vw);background:transparent;border:0;border-bottom:1px solid rgba(0,0,0,.2);outline:0;padding:8px 4px;font:inherit;font-size:18px;letter-spacing:.02em;color:#111;text-align:center;border-radius:0;user-select:text;-webkit-user-select:text}
#nm::placeholder{color:#111;opacity:.2}
.r u{text-decoration:none;flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r b{flex:none!important}
.nil{font-size:11px;opacity:.4;letter-spacing:.2em}
#field{position:absolute;inset:0}
.tok{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;line-height:1;font-weight:300;letter-spacing:-.02em;
transition:transform .17s cubic-bezier(.2,.8,.2,1),font-size .17s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tok i{display:block;font-style:normal;transition:transform .17s,opacity .17s;animation:in .14s ease-out}
@keyframes in{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
#toast{position:absolute;left:0;right:0;top:20%;text-align:center;pointer-events:none;opacity:0;transition:opacity .15s}
#toast.s{opacity:1}
#toast b{display:block;font-weight:400;font-size:11px;letter-spacing:.35em}
#toast span{display:block;font-weight:200;font-size:28px;margin-top:8px}
.pop{position:absolute;font-size:13px;letter-spacing:.1em;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s}
.big{font-weight:200;font-size:clamp(56px,16vw,120px);line-height:1}
.lab{font-size:10px;letter-spacing:.3em;opacity:.5;margin:0 0 10px .3em}
.row{display:flex;gap:28px;margin-top:56px}
</style></head><body>

<div class="screen on" id="name" style="gap:56px">
 <div style="font-size:22px;letter-spacing:.34em;font-weight:400;margin-left:.34em">PRIME</div>
 <div style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%">
  <input id="nm" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="NAME">
  <div style="font-size:10px;letter-spacing:.22em;opacity:.3">PRESS ENTER</div></div>
</div>

<div class="screen" id="top">
 <div class="link" id="who" style="position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;font-size:10px;opacity:.4;margin:0"></div>
 <h1>PRIME</h1><div class="sub">60 SECONDS</div>
 <div class="link" id="start">START</div>
 <div class="link" id="sbtn" style="opacity:.5;font-size:10px;margin-top:8px">SCORE</div>
</div>

<div class="screen" id="game">
 <div class="hud" id="sc">SCORE 0</div><div class="hud" id="cb" style="left:0;right:0;text-align:center;opacity:.5"></div><div class="hud" id="tm">01:00</div><div class="hud ui" id="quit">TOP</div>
 <div id="field"></div><div id="toast"><b>PRIME COMPLETE</b><span></span></div>
</div>

<div class="screen" id="conf"><div style="font-size:13px;letter-spacing:.15em;font-weight:300">中断してTOPに戻りますか？</div>
 <div class="row" style="margin-top:36px"><div class="link" id="cy">TOPへ戻る</div><div class="link" id="cn" style="opacity:.5">続ける</div></div></div>

<div class="screen" id="board"><div class="bd">
 <div class="lab">YOUR BEST 5</div><div id="mine"></div>
 <div class="lab">WORLD TOP 100</div><div id="world"></div>
 <div class="link" id="bback" style="margin:40px 0 0 -16px;opacity:.5;font-size:10px">TOP</div></div></div>

<div class="screen" id="end">
 <div class="lab">SCORE</div><div class="big" id="rs">0</div>
 <div class="lab" style="margin-top:40px">PRIME COMPLETE</div><div style="font-weight:200;font-size:32px" id="rc">0</div>
 <div class="row"><div class="link" id="retry">RETRY</div><div class="link" id="home" style="opacity:.5">TOP</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const field=$('field'),gameEl=$('game'),toast=$('toast');
// ===== core (shared by client and server: keep identical) =====
const MULT=[1,10,50,100,150,200]; // 分解回数(0,1,2,3,4,5以上)ごとの倍率
const DUR=60000,MINGAP=60,LIM=2000,sv=new Uint8Array(LIM+1);sv[0]=sv[1]=1;
for(let i=2;i*i<=LIM;i++)if(!sv[i])for(let j=i*i;j<=LIM;j+=i)sv[j]=1;
const P=[];for(let i=2;i<=LIM;i++)if(!sv[i])P.push(i);
const isP=n=>n>1&&!sv[n];
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function split(n,rnd){
 const d=[];for(let a=2;a*a<=n;a++)if(n%a===0)d.push(a);
 const w=d.map(a=>0.4+a/Math.sqrt(n));let t=w.reduce((x,y)=>x+y),r=rnd()*t,i=0;
 while(i<d.length-1&&(r-=w[i])>0)i++;
 const a=d[i],b=n/a;return rnd()<.5?[a,b]:[b,a];
}
function gen(prog,rnd,last){
 const R=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[Math.floor(rnd()*a.length)];
 const small=P.filter(p=>p<50),mid=P.filter(p=>p>=50&&p<300),big=P.filter(p=>p>=300&&p<1000),huge=P.filter(p=>p>=1000);
 const smp=()=>pick(P.slice(0,8));
 const kinds=[
  [3,()=>R(4,60)],[3,()=>R(60,300)],[1+prog*3,()=>R(300,1500)],
  [1.5,()=>pick(small)],[1.8,()=>pick(mid)],[1+prog*1.5,()=>pick(big)],[.2+prog*1.2,()=>pick(huge)],
  [1.6,()=>{let n=1,k=R(3,5+Math.round(prog*2));while(k--)n*=smp();return n}],
  [1,()=>{const x=R(3,12+Math.round(prog*20));return x*x}],
  [1,()=>pick(P.slice(0,12))*pick(P.slice(0,40))]
 ];
 let n;do{let t=kinds.reduce((s,k)=>s+k[0],0),r=rnd()*t,i=0;
 while(i<kinds.length-1&&(r-=kinds[i][0])>0)i++;n=kinds[i][1]();n=Math.min(n,1999);}while(n===last||n<2);
 return n;
}
// ops: [[tokenIndex, dir(1|-1), tMs], ...]  -> {score,done} or null if invalid
function replay(seed,ops){
 if(!Array.isArray(ops)||ops.length>3000)return null;
 const rnd=mulberry32(seed);let last=0,score=0,done=0,toks=[],prev=-1e9,lastT=0,cur=0,spl=0;
 const spawn=t=>{last=gen(Math.min(1,t/DUR),rnd,last);toks=[{n:last,d:0}];cur=0;spl=0};
 spawn(0);
 for(const o of ops){
  if(!Array.isArray(o))return null;const [idx,dir,t]=o;
  if(!Number.isInteger(idx)||!Number.isInteger(t)||t<0||t>=DUR||t-prev<MINGAP)return null;
  prev=lastT=t;const k=toks[idx];if(!k)return null;
  if(dir===1){if(isP(k.n))return null;const [a,b]=split(k.n,rnd);toks.splice(idx,1,{n:a,d:k.d+1},{n:b,d:k.d+1});spl++}
  else if(dir===-1){if(!isP(k.n))return null;cur+=k.n;toks.splice(idx,1);if(!toks.length){score+=cur*MULT[Math.min(spl,5)];done++;spawn(t)}}
  else return null;
 }
 return{score,done,lastT};
}
if(typeof module!=='undefined')module.exports={MULT,DUR,MINGAP,replay,mulberry32,gen,split,isP};
let spl=0,rnd=Math.random,seed=0,sid=null,ops=[],lastOp=-1e9,last=0;
// ---------- audio ----------
let AC;
function beep(f,d=.05,v=.06,ty='sine',at=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.01);}catch(e){}}
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
// ---------- state ----------
let toks=[],state='name',score=0,done=0,t0=0,cur=0,busy=false;
function mk(n,d,x,y){
 const el=document.createElement('div');el.className='tok';const i=document.createElement('i');i.textContent=n;el.appendChild(i);
 field.appendChild(el);const t={n,d,el,i,x,y};toks.push(t);return t;
}
function layout(){
 const W=field.clientWidth,H=field.clientHeight;if(!toks.length)return;
 const base=Math.min(H*.3,W*.5);let k=1,rows,tot;
 for(let g=0;g<50;g++){
  rows=[];let row=null;
  toks.forEach(t=>{t.s=Math.max(26,base*Math.pow(.8,t.d)*k);t.w=String(t.n).length*.6*t.s+t.s*.3;
   if(!row||row.w+t.w>W*.9){row={w:0,h:0,t:[]};rows.push(row)}
   row.t.push(t);row.w+=t.w;row.h=Math.max(row.h,t.s*1.1)});
  tot=rows.reduce((a,r)=>a+r.h,0);
  if(tot<=H*.7&&rows.every(r=>r.w<=W*.92)||base*k<30)break;k*=.92;
 }
 let y=(H-tot)/2;
 rows.forEach(r=>{let x=(W-r.w)/2;r.t.forEach(t=>{t.x=x+t.w/2;t.y=y+r.h/2;
  const e=t.el;e.style.fontSize=t.s+'px';e.style.width=t.w+'px';
  e.style.transform=`translate(${t.x-t.w/2}px,${t.y-t.s/2}px)`;x+=t.w});y+=r.h});
}
function spawn(tt){
 const n=last=gen(Math.min(1,tt/DUR),rnd,last);cur=0;spl=0;$('cb').textContent='';
 const t=mk(n,0,field.clientWidth/2,field.clientHeight/2);layout();busy=false;
}
function showToast(h,v,m){
 toast.querySelector('b').textContent=h;toast.querySelector('span').textContent=(m>1?'×'+m+'  ':'')+'+'+v;
 toast.classList.add('s');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('s'),650);
}
function pop(t,v){
 const p=document.createElement('div');p.className='pop';p.textContent='+'+v;
 p.style.left=Math.max(14,Math.min(field.clientWidth-50,t.x-14))+'px';p.style.top=(t.y-t.s*.75)+'px';field.appendChild(p);
 requestAnimationFrame(()=>{p.style.opacity=.6;p.style.transform='translateY(-12px)'});
 setTimeout(()=>{p.style.opacity=0},350);setTimeout(()=>p.remove(),900);
}
function bad(t){
 t.i.style.transition='';t.i.style.transform='';t.i.style.opacity='';
 t.i.animate([{transform:'translateX(0)'},{transform:'translateX(-12px)'},{transform:'translateX(10px)'},{transform:'translateX(-5px)'},{transform:'translateX(0)'}],{duration:190,easing:'ease-out'});
 beep(130,.07,.04,'triangle');vib(6);
}
function act(t,dir){
 if(state!=='play'||busy||!t||t.gone)return;
 const T=Math.round(performance.now()-t0);if(T>=DUR||T-lastOp<MINGAP)return;
 const prime=isP(t.n);
 if(dir>0){
  if(prime)return bad(t);
  const idx=toks.indexOf(t);ops.push([idx,1,T]);lastOp=T;const [a,b]=split(t.n,rnd);spl++;{const m=MULT[Math.min(spl,5)];$('cb').textContent='×'+m}t.gone=1;
  t.el.remove();toks.splice(idx,1);
  const A=mk(a,t.d+1,t.x,t.y),B=mk(b,t.d+1,t.x,t.y);toks.pop();toks.pop();toks.splice(idx,0,A,B);
  [A,B].forEach(z=>{z.el.style.transform=`translate(${t.x-t.w/2}px,${t.y-t.s/2}px)`;z.el.style.fontSize=t.s+'px';z.el.style.width=t.w+'px'});
  requestAnimationFrame(layout);
  beep(520+Math.random()*80,.03,.05,'square');vib(8);
 }else{
  if(!prime)return bad(t);
  t.gone=1;{const ix=toks.indexOf(t);ops.push([ix,-1,T]);lastOp=T;toks.splice(ix,1)}
  t.i.style.transition='transform .2s ease-in,opacity .2s';t.i.style.transform='translateX(-45vw)';t.i.style.opacity=0;
  setTimeout(()=>t.el.remove(),230);
  cur+=t.n;if(toks.length)pop(t,t.n);
  beep(880+Math.min(t.n,900)/3,.09,.06);vib(10);layout();
  if(!toks.length){
   done++;busy=true;
   const m=MULT[Math.min(spl,5)];score+=cur*m;$('sc').textContent='SCORE '+score;$('cb').textContent='';
   showToast(t.d===0?'PRIME':'PRIME COMPLETE',cur*m,m);
   if(t.d>0)[1047,1319,1568].forEach((f,i)=>beep(f,.07,.045,'sine',i*.06));
   setTimeout(()=>{if(state==='play')spawn(T)},t.d===0?220:380);
  }
 }
}
// ---------- input ----------
let drag=null;
gameEl.addEventListener('pointerdown',e=>{
 if(e.target.closest('.ui')||state!=='play'||busy||!toks.length)return;
 const r=field.getBoundingClientRect();let best=null,bd=1e9;
 toks.forEach(t=>{const d=Math.hypot(t.x-(e.clientX-r.left),(t.y-(e.clientY-r.top))*.6);if(d<bd){bd=d;best=t}});
 drag={t:best,sx:e.clientX,id:e.pointerId};best.i.style.transition='none';gameEl.setPointerCapture(e.pointerId);
});
gameEl.addEventListener('pointermove',e=>{
 if(!drag)return;const dx=e.clientX-drag.sx,T=Math.min(70,field.clientWidth*.14),t=drag.t;
 t.i.style.transform=`translateX(${dx*.8}px)`;t.i.style.opacity=1-Math.min(.5,Math.abs(dx)/400);
 if(Math.abs(dx)>=T){drag=null;t.i.style.transition='';t.i.style.opacity='';t.i.style.transform='';act(t,dx>0?1:-1)}
});
const endDrag=()=>{if(!drag)return;const t=drag.t;drag=null;t.i.style.transition='transform .18s cubic-bezier(.2,.8,.2,1),opacity .18s';t.i.style.transform='';t.i.style.opacity=''};
gameEl.addEventListener('pointerup',endDrag);gameEl.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
 if(state==='play'){if(e.key==='Escape')pause();else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();act(toks[0],e.key==='ArrowRight'?1:-1)}}
 else if(state==='pause'){if(e.key==='Escape'||e.key==='Enter')resume()}
 else if(e.key==='Enter'&&!e.repeat&&(state==='top'||state==='end')&&performance.now()-navAt>400)begin();
});
addEventListener('resize',layout);
// ---------- flow ----------
function show(id){['name','top','game','end','board'].forEach(s=>$(s).classList.toggle('on',s===id))}
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
async function begin(){
 if(state==='starting')return;
 AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();
 state='starting';field.innerHTML='';toks=[];score=0;done=0;cur=0;busy=false;last=0;ops=[];lastOp=-1e9;sid=null;
 $('sc').textContent='SCORE 0';$('tm').textContent='01:00';toast.classList.remove('s');show('game');
 try{const r=await call('startGame',{});sid=r.id;seed=r.seed>>>0}catch(e){seed=(Math.random()*4294967296)>>>0} // 失敗時はオフラインプレイ(ランキング対象外)
 rnd=mulberry32(seed);t0=performance.now();state='play';spawn(0);requestAnimationFrame(tick);
}
function tick(){
 if(state!=='play')return;const left=DUR-(performance.now()-t0);
 $('tm').textContent=fmt(left);
 if(left<=0)return finish();requestAnimationFrame(tick);
}
function finish(){
 state='over';$('tm').textContent='00:00';drag=null;
 toks.forEach(t=>t.el.style.opacity=0);
 toast.querySelector('b').textContent='TIME UP';toast.querySelector('span').textContent='';toast.classList.add('s');
 beep(330,.25,.05);
 submit();
 setTimeout(()=>{toast.classList.remove('s');$('rs').textContent=score;$('rc').textContent=done;state='end';show('end')},1000);
}
// ---------- pause ----------
let pAt=0;
function pause(){if(state!=='play')return;state='pause';pAt=performance.now();drag=null;$('conf').classList.add('on')}
function resume(){if(state!=='pause')return;t0+=performance.now()-pAt;state='play';$('conf').classList.remove('on');requestAnimationFrame(tick)}
$('quit').onclick=pause;$('cn').onclick=resume;
$('cy').onclick=()=>{state='top';$('conf').classList.remove('on');show('top')};
// ---------- scores ----------
const FB={apiKey:"AIzaSyDpgZwORu77hqcSk3MlxjdhuaiFMkhz_fc",project:"prime-yno2jyou"};
const FS='https://firestore.googleapis.com/v1/projects/'+FB.project+'/databases/(default)/documents';
async function auth(){ // anonymous auth via REST, token cached
 let a=null;try{a=JSON.parse(localStorage.getItem('prime_auth'))}catch(e){}
 const save=x=>{try{localStorage.setItem('prime_auth',JSON.stringify(x))}catch(e){}return x};
 if(a&&a.exp>Date.now()+60000)return a;
 if(a&&a.refresh){const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(a.refresh)});
  if(r.ok){const j=await r.json();return save({uid:j.user_id,idToken:j.id_token,refresh:j.refresh_token,exp:Date.now()+j.expires_in*1000})}}
 const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"returnSecureToken":true}'});
 if(!r.ok)throw 0;const j=await r.json();
 return save({uid:j.localId,idToken:j.idToken,refresh:j.refreshToken,exp:Date.now()+j.expiresIn*1000});
}
const FN='https://asia-northeast1-'+FB.project+'.cloudfunctions.net/';
async function call(name,data){const a=await auth();
 const r=await fetch(FN+name,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+a.idToken},body:JSON.stringify({data})});
 if(!r.ok)throw 0;return (await r.json()).result}
async function remoteTop(){
 const r=await fetch(FS+':runQuery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({structuredQuery:{from:[{collectionId:'scores'}],orderBy:[{field:{fieldPath:'score'},direction:'DESCENDING'}],limit:100}})});
 if(!r.ok)throw 0;const j=await r.json();
 return j.filter(x=>x.document).map(x=>{const f=x.document.fields;return{n:String(f.name.stringValue).slice(0,12),s:+f.score.integerValue,t:Date.parse(f.ts.timestampValue)}});
}
let PN=(()=>{try{return localStorage.getItem('prime_name')||''}catch(e){return''}})();
const LK='prime_best';
const loadMine=()=>{try{return JSON.parse(localStorage.getItem(LK))||[]}catch(e){return[]}};
function submit(){
 if(score<=0)return;const ts=Date.now();
 try{const a=loadMine();a.push({s:score,t:ts,n:PN});a.sort((x,y)=>y.s-x.s);localStorage.setItem(LK,JSON.stringify(a.slice(0,5)))}catch(e){}
 if(sid){const id=sid;sid=null;call('submitScore',{id,name:PN,ops}).catch(()=>{})}
}
const fd=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())};
function rows(el,list){
 el.textContent='';
